services:
  ml:
    build: .
    command: uvicorn guardian.api.ml_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs

  agent:
    build: .
    command: uvicorn guardian.api.agent_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    environment:
      # Ollama runs on the HOST, not in a container — see Dockerfile.
      # host.docker.internal works on Docker Desktop (Mac/Windows) out of
      # the box; extra_hosts below adds the same alias on Linux.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ML_SERVICE_URL=http://ml:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./mlflow.db:/app/mlflow.db
    depends_on:
      - ml

  dashboard:
    build: .
    command: streamlit run src/guardian/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./mlflow.db:/app/mlflow.db
    depends_on:
      - ml
      - agent
